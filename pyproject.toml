[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcped-function-tools"
version = "0.1.0"
description = "Lightweight SDK for agent tools with MCP-style function interfaces"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "sth_boring contributors" }
]
dependencies = [
  "httpx[http2]>=0.27",
  "selectolax>=0.3",
  "playwright>=1.40.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src", "src/AgentCrawler/src"]
